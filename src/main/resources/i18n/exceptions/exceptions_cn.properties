# TaskParser
TODO_DESCRIPTION_MISSING=待办事项需要描述。示例：todo 借书
DEADLINE_BY_MARKER_MISSING=截止任务需要在 "/by" 后填写日期和时间。示例：deadline 提交报告 /by 2019-12-02 1800
DEADLINE_DESCRIPTION_MISSING=截止任务需要在 "/by" 前填写描述。示例：deadline 提交报告 /by 2019-12-02 1800
DEADLINE_BY_VALUE_MISSING=请在 "/by" 后填写日期和时间。示例：deadline 提交报告 /by 2019-12-02 1800
DEADLINE_DATE_INVALID=请在 "/by" 后输入有效日期和时间，格式为 YYYY-MM-DD HHmm 或 D/M/YYYY HHmm。
EVENT_FROM_MARKER_MISSING=活动需要 "/from"。示例：event 会议 /on 2019-12-02 /from 1400 /to 1600
EVENT_TO_MARKER_MISSING=活动需要 "/to"。示例：event 会议 /on 2019-12-02 /from 1400 /to 1600
EVENT_MARKERS_OUT_OF_ORDER=请按 "/on"、"/from"、"/to" 的顺序填写。示例：event 会议 /on 2019-12-02 /from 1400 /to 1600
EVENT_DESCRIPTION_MISSING=活动需要在日期或时间标记前填写描述。示例：event 会议 /on 2019-12-02 /from 1400 /to 1600
EVENT_FROM_VALUE_MISSING=请在 "/from" 后填写开始值。示例：event 会议 /on 2019-12-02 /from 1400 /to 1600
EVENT_TO_VALUE_MISSING=请在 "/to" 后填写结束值。示例：event 会议 /on 2019-12-02 /from 1400 /to 1600
EVENT_DATE_INVALID=请输入有效的活动日期。使用 "/on" 时格式为 YYYY-MM-DD 或 D/M/YYYY；否则每个端点使用 YYYY-MM-DD HHmm 或 D/M/YYYY HHmm。
EVENT_START_TIME_INVALID=请输入有效的开始时间，格式为 HHmm，例如 1400。
EVENT_END_TIME_INVALID=请输入有效的结束时间，格式为 HHmm，例如 1600。
EVENT_END_NOT_AFTER_START=活动结束时间必须严格晚于开始时间。
DUPLICATE_MARKER="%s" 只能出现一次。请删除多余的标记后重试。
LIST_DATE_INVALID=请输入有效日期，格式为 YYYY-MM-DD 或 D/M/YYYY。示例：list 2019-12-02
FIND_QUERY_MISSING=find 指令需要搜索词。示例：find 借书
TASK_ID_MISSING=请输入要执行 %1$s 操作的任务编号。示例：%1$s 1
TASK_ID_NOT_INTEGER="%s" 不是有效的任务编号。请输入正整数。
TASK_ID_NOT_POSITIVE=任务编号从 1 开始。输入 "list" 查看可用的任务编号。
TASK_ID_TOO_LARGE=任务编号 "%s" 太大。输入 "list" 查看可用的任务编号。
TASK_LIST_EMPTY=目前没有任务可执行 %s 操作。请先添加任务，例如：todo 借书
TASK_NOT_FOUND=任务 %d 不存在。请选择 1 至 %d 之间的编号，或输入 "list" 查看任务。
UNKNOWN_COMMAND="%s" 不是可识别的指令。输入“help”可查看所有指令和接受的格式。
STORAGE_MALFORMED=任务文件 "%s" 第 %d 行的数据无效。请在程序外修复文件，然后重新启动 Megia。重新启动前，指令和保存功能均已禁用。
STORAGE_UNREADABLE=无法读取任务文件 "%s"。请检查文件是否可访问，然后重新启动 Megia。重新启动前，指令和保存功能均已禁用。
STORAGE_WRITE_FAILED=无法保存任务文件 "%s"。请检查文件夹是否可写，然后重试。
DESCRIPTION_LINE_BREAK=任务描述必须保持在一行内。请删除换行符后重试。
