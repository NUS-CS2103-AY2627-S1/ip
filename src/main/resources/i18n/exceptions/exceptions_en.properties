# TaskParser
TODO_DESCRIPTION_MISSING=A todo needs a description. Try: todo borrow a book
DEADLINE_BY_MARKER_MISSING=A deadline needs "/by" followed by its date and time. Try: deadline submit report /by 2019-12-02 1800
DEADLINE_DESCRIPTION_MISSING=A deadline needs a description before "/by". Try: deadline submit report /by 2019-12-02 1800
DEADLINE_BY_VALUE_MISSING=Enter a date and time after "/by". Try: deadline submit report /by 2019-12-02 1800
DEADLINE_DATE_INVALID=Enter a valid date and time after "/by" using YYYY-MM-DD HHmm or D/M/YYYY HHmm.
EVENT_FROM_MARKER_MISSING=An event needs "/from". Try: event meeting /on 2019-12-02 /from 1400 /to 1600
EVENT_TO_MARKER_MISSING=An event needs "/to". Try: event meeting /on 2019-12-02 /from 1400 /to 1600
EVENT_MARKERS_OUT_OF_ORDER=Use "/on", then "/from", then "/to". Try: event meeting /on 2019-12-02 /from 1400 /to 1600
EVENT_DESCRIPTION_MISSING=An event needs a description before its date or time markers. Try: event meeting /on 2019-12-02 /from 1400 /to 1600
EVENT_FROM_VALUE_MISSING=Enter a start value after "/from". Try: event meeting /on 2019-12-02 /from 1400 /to 1600
EVENT_TO_VALUE_MISSING=Enter an end value after "/to". Try: event meeting /on 2019-12-02 /from 1400 /to 1600
EVENT_DATE_INVALID=Enter a valid event date. With "/on", use YYYY-MM-DD or D/M/YYYY; otherwise use YYYY-MM-DD HHmm or D/M/YYYY HHmm.
EVENT_START_TIME_INVALID=Enter a valid start time using HHmm, such as 1400.
EVENT_END_TIME_INVALID=Enter a valid end time using HHmm, such as 1600.
EVENT_END_NOT_AFTER_START=An event's end must be strictly after its start.
DUPLICATE_MARKER="%s" can only appear once. Remove the extra marker and try again.
LIST_DATE_INVALID=Enter a valid date using YYYY-MM-DD or D/M/YYYY. Try: list 2019-12-02
FIND_QUERY_MISSING=A find command needs a search term. Try: find borrow a book
TASK_ID_MISSING=Enter the task number to %1$s. Try: %1$s 1
TASK_ID_NOT_INTEGER="%s" is not a valid task number. Enter a positive whole number.
TASK_ID_NOT_POSITIVE=Task numbers start from 1. Use "list" to see the available task numbers.
TASK_ID_TOO_LARGE=The task number "%s" is too large. Use "list" to see the available task numbers.
TASK_LIST_EMPTY=There are no tasks to %s. Add one first, for example: todo borrow a book
TASK_NOT_FOUND=Task %d does not exist. Choose a number from 1 to %d, or use "list" to view your tasks.
UNKNOWN_COMMAND="%s" is not a recognized command. Enter "help" for all commands and accepted formats.
STORAGE_MALFORMED=The task file "%s" contains invalid data on line %d. Repair the file externally, then restart Megia. Commands and saving are disabled until restart.
STORAGE_UNREADABLE=The task file "%s" could not be read. Check that it is accessible, then restart Megia. Commands and saving are disabled until restart.
STORAGE_WRITE_FAILED=The task file "%s" could not be saved. Check that its folder is writable, then try again.
DESCRIPTION_LINE_BREAK=Task descriptions must stay on one line. Remove the line break and try again.
