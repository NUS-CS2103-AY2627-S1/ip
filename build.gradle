plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '14.1.0'
}

dependencies {
    String javaFxVersion = '17.0.7'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    enableAssertions = true
    // Match the English examples without changing the application's default locale.
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'epi.gui.GuiLauncher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'epi.jar'
}

run {
    standardInput = System.in
}

tasks.register('prepareUiTests') {
    group = 'verification'
    description = 'Compile Epi and export its runtime configuration for isolated console tests.'
    dependsOn tasks.named('classes')

    def runtimeFile = layout.buildDirectory.file('ui-tests/runtime.json')
    outputs.file(runtimeFile)
    // Refresh the executable path when the JDK running Gradle changes.
    outputs.upToDateWhen { false }

    doLast {
        def javaName = System.getProperty('os.name').startsWith('Windows') ? 'java.exe' : 'java'
        def runtime = [
            javaExecutable: new File(System.getProperty('java.home'), 'bin/' + javaName).absolutePath,
            classpath: sourceSets.main.runtimeClasspath.asPath
        ]
        def output = runtimeFile.get().asFile
        output.parentFile.mkdirs()
        output.setText(groovy.json.JsonOutput.toJson(runtime), 'UTF-8')
    }
}

tasks.register('guiSmokeTest', JavaExec) {
    group = 'verification'
    description = 'Check JavaFX layout in an isolated session and save scene previews (requires a desktop).'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'epi.gui.GuiSmokeCheck'
    enableAssertions = true
    systemProperty 'user.language', 'en'
    systemProperty 'user.country', 'US'
    systemProperty 'epi.guiReportDirectory', layout.buildDirectory.dir('reports/gui-smoke').get().asFile.absolutePath

    doFirst {
        // Never load personal tasks or reuse data from a previous GUI test run.
        workingDir = new File(temporaryDir, UUID.randomUUID().toString())
        workingDir.mkdirs()
    }
}
