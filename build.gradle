plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

checkstyle {
    toolVersion = '11.0.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    // Select a locally installed JDK 25 even when Gradle itself starts on another JDK.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

configurations {
    javafxWindows
    javafxMac
    javafxMacArm64
    javafxLinux
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'
    List<String> javaFxModules = ['base', 'graphics', 'controls', 'fxml']

    javaFxModules.each { module ->
        compileOnly("org.openjfx:javafx-${module}:${javaFxVersion}:win")
        runtimeOnly("org.openjfx:javafx-${module}:${javaFxVersion}:win")
        add('javafxWindows', "org.openjfx:javafx-${module}:${javaFxVersion}:win")
        add('javafxMac', "org.openjfx:javafx-${module}:${javaFxVersion}:mac")
        add('javafxMacArm64', "org.openjfx:javafx-${module}:${javaFxVersion}:mac-aarch64")
        add('javafxLinux', "org.openjfx:javafx-${module}:${javaFxVersion}:linux")
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'computa.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'computa-windows.jar'
    configurations = [project.configurations.javafxWindows]
    // Keep the generated artifact directly executable with `java -jar`.
    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

/** Configures a platform-specific executable JAR with matching JavaFX native libraries. */
def configurePlatformJar = { ShadowJar task, String configurationName, String archiveName ->
    task.archiveFileName = archiveName
    task.from sourceSets.main.output
    task.configurations = [project.configurations[configurationName]]
    task.manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.register('shadowJarMac', ShadowJar) {
    configurePlatformJar(delegate, 'javafxMac', 'computa-mac.jar')
}

tasks.register('shadowJarMacArm64', ShadowJar) {
    configurePlatformJar(delegate, 'javafxMacArm64', 'computa-mac-arm64.jar')
}

tasks.register('shadowJarLinux', ShadowJar) {
    configurePlatformJar(delegate, 'javafxLinux', 'computa-linux.jar')
}

// Include the distributable fat JAR whenever the normal build lifecycle runs.
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('shadowJarMac')
    dependsOn tasks.named('shadowJarMacArm64')
    dependsOn tasks.named('shadowJarLinux')
}

run {
    standardInput = System.in
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}
