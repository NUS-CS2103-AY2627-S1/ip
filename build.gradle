plugins {
    id 'java'
    id 'application'
    // Measures which lines the tests run; see the jacocoTestReport task below.
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:mac-aarch64")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:mac-aarch64")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:mac-aarch64")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:mac-aarch64")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    // @ParameterizedTest, for running one test over many inputs.
    testImplementation "org.junit.jupiter:junit-jupiter-params:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

// Writes a coverage report to build/reports/jacoco/test/html/index.html after the tests.
// Run with: ./gradlew test jacocoTestReport
jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
    }
    // The JavaFX classes are tested by hand (see docs/manual-testing.md), so counting
    // them would only hide how well the rest of the code is covered.
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: ['davidgoggins/gui/**', 'davidgoggins/Main*', 'davidgoggins/Launcher*'])
        }))
    }
}

application {
    mainClass = 'davidgoggins.Launcher'
}

// The text UI is kept because most of the logic can be tested through it, which is
// far easier than driving the GUI. Run it with: ./gradlew runText --console=plain
tasks.register('runText', JavaExec) {
    group = 'application'
    description = 'Runs the chatbot with its original text UI.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'davidgoggins.DavidGoggins'
    standardInput = System.in
    enableAssertions = true
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'davidgoggins.jar'
}

run {
    standardInput = System.in
    // Java ignores assert statements unless the JVM is started with -ea; this turns them on.
    enableAssertions = true
}
