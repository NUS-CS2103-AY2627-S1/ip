plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources', 'src/main/images']
        }
    }
}

dependencies {
    // Include JavaFX artifacts for every grading platform. Shadow packages
    // the classes and native libraries into one fat JAR; JavaFX selects the
    // matching native library for the operating system at runtime.
    ['linux', 'mac', 'win'].each { platform ->
        implementation "org.openjfx:javafx-base:25:${platform}"
        implementation "org.openjfx:javafx-graphics:25:${platform}"
        implementation "org.openjfx:javafx-controls:25:${platform}"
        implementation "org.openjfx:javafx-fxml:25:${platform}"
    }

    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    // Launch through a plain main class so java -jar does not use the
    // launcher path that expects JavaFX modules outside the JAR.
    mainClass = 'michael.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'michael.jar'
}

run {
    standardInput = System.in
}
