plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    String javaFxVersion = '17.0.7' // Choose a version compatible with your JDK

    // JavaFX dependencies with OS platform classifiers
    def platforms = ['win', 'mac', 'mac-aarch64', 'linux']
    platforms.each { platform ->
        implementation "org.openjfx:javafx-base:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-controls:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-fxml:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${platform}"
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }

    enableAssertions = true
}

application {
    mainClass = 'spoon.Launcher'
}

checkstyle {
    toolVersion = '14.1.0'
    ignoreFailures = true
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'spoon.jar'
}

// Command Line Interface
run {
    mainClass = 'spoon.Spoon'
    standardInput = System.in
    enableAssertions = true
}

// Graphical User Interface
tasks.register('runGUI', JavaExec) {
    group = 'application'
    description = 'Runs the JavaFX GUI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'spoon.Launcher'    // GUI launcher entry point
    enableAssertions = false
}
