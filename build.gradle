plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

checkstyle {
    toolVersion = '11.0.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

javafx {
    version = "25"
    modules = ['javafx.controls', 'javafx.fxml']
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '25'
    List<String> javaFxModules = ['base', 'graphics', 'controls', 'fxml']
    List<String> javaFxPlatforms = ['win', 'linux', 'mac-aarch64']

    javaFxModules.each { module ->
        javaFxPlatforms.each { platform ->
            implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test

    reports {
        html.required = true
        xml.required = true
    }
}

application {
    mainClass = 'thomas.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveBaseName.set('thomas')
    archiveClassifier.set('')
    archiveVersion.set('')
    archiveFileName = 'thomas.jar'

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

run {
    standardInput = System.in
}
