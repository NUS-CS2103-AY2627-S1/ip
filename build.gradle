plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

// One place to change the JavaFX version: the javafx block and the per-platform
// native libraries in the dependencies block must always agree.
ext.javafxVersion = '25'

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    // JavaFX ships its native libraries in a separate artifact per platform, and the
    // javafx plugin below only fetches the one this machine needs. Asking for the
    // others as well is what makes the shadow JAR run on someone else's computer
    // instead of only on the one that built it.
    //
    // Only one architecture per operating system can be carried: the Intel and ARM
    // builds name their libraries identically (libglass.dylib and so on), so the
    // first one listed is the one that ends up in the JAR and the other is dropped.
    // macOS is therefore built for Apple Silicon, which is every Mac since 2020.
    ['win', 'mac-aarch64', 'linux'].each { platform ->
        implementation "org.openjfx:javafx-base:${javafxVersion}:${platform}"
        implementation "org.openjfx:javafx-graphics:${javafxVersion}:${platform}"
        implementation "org.openjfx:javafx-controls:${javafxVersion}:${platform}"
    }
}

javafx {
    version = javafxVersion
    modules = ['javafx.controls']
}

checkstyle {
    // Matches the version se-edu's addressbook-level3 uses, which is where
    // config/checkstyle/checkstyle.xml came from.
    toolVersion = '14.1.0'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    // The window is the product now; the console version is still there as emma.Emma.
    mainClass = 'emma.gui.Launcher'
    // JavaFX loads native libraries; without this Java 25 prints a restricted-method warning.
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'emma.jar'
}

run {
    standardInput = System.in
    // Assertions are off unless the JVM is given -ea, which would make them dead code.
    enableAssertions = true
}
