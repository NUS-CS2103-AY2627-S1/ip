plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

checkstyle {
    toolVersion = '11.0.0'
}

repositories {
    mavenCentral()
}

String osName = System.getProperty('os.name').toLowerCase()
String architecture = System.getProperty('os.arch').toLowerCase()
String javaFxPlatform

if (osName.contains('mac')) {
    javaFxPlatform = architecture.contains('aarch64') || architecture.contains('arm64') ? 'mac-aarch64' : 'mac'
} else if (osName.contains('windows')) {
    javaFxPlatform = 'win'
} else {
    javaFxPlatform = 'linux'
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:${javaFxPlatform}")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:${javaFxPlatform}")

    // Package native JavaFX libraries for each desktop operating system in the fat JAR.
    runtimeOnly "org.openjfx:javafx-graphics:${javaFxVersion}:win"
    runtimeOnly "org.openjfx:javafx-graphics:${javaFxVersion}:linux"
    runtimeOnly "org.openjfx:javafx-graphics:${javaFxVersion}:mac"
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'hse.gui.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'hse.jar'
}

run {
    standardInput = System.in
}
