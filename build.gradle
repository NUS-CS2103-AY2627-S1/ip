plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'checkstyle'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '10.18.1'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")
}

tasks.withType(Checkstyle).configureEach {
    configDirectory = file("${rootDir}/config/checkstyle")
    reports {
        html.required = true
        xml.required = false
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '25.0.1'

    // List JavaFX for every OS (not just the build machine's OS) so the fat JAR is cross-platform,
    // as recommended by the course's JavaFX tutorial.
    ['win', 'mac', 'linux'].each { platform ->
        ['base', 'graphics', 'controls'].each { module ->
            implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'thaisbot.gui.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'duke.jar'
    // JavaFX loads native code; allow it so Java 25 does not print restricted-method warnings.
    manifest {
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

run {
    standardInput = System.in
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}
