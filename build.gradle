plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

javafx {
    version = '25.0.3'
    modules = ['javafx.controls', 'javafx.fxml']
}

configurations {
    // Keep additional platforms separate from the host-specific JavaFX runtime.
    windowsJavafx
    linuxJavafx
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    // Include platform-specific classes and native libraries for distribution.
    [windowsJavafx: 'win', linuxJavafx: 'linux'].each { configuration, platform ->
        ['base', 'graphics', 'controls', 'fxml'].each { module ->
            add(configuration, "org.openjfx:javafx-${module}:${javafx.version}:${platform}@jar")
        }
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
    }
}

application {
    mainClass = 'goop.Launcher'
    applicationDefaultJvmArgs = ['--enable-native-access=javafx.graphics']
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'duke.jar'
    configurations = [project.configurations.runtimeClasspath,
                      project.configurations.windowsJavafx, project.configurations.linuxJavafx]
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    // Make the fat JAR directly executable with `java -jar`.
    manifest {
        attributes 'Main-Class': application.mainClass.get(),
                'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

run {
    standardInput = System.in
}
