plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    //id 'checkstyle'
}
/*
checkstyle {
    toolVersion = '10.17.0'
    configFile = file("$rootDir/config/checkstyle/checkstyle.xml")
}*/

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

ext {
    jUnitVersion = '5.12.2'
}

dependencies {
    String javaFxVersion = '17.0.7'

    def javafxModules = [
            'base',
            'controls',
            'fxml',
            'graphics',
            'media'
    ]

    def javafxPlatforms = [
            'win',
            'linux',
            'mac'
    ]

    javafxModules.each { module ->
        // Platform-independent JavaFX classes
        implementation(
                "org.openjfx:javafx-${module}:${javaFxVersion}"
        )

        // Native libraries for each operating system
        javafxPlatforms.each { platform ->
            runtimeOnly(
                    "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
            )
        }
    }

    testImplementation(
            "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"
    )

    testRuntimeOnly(
            "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    )

    testRuntimeOnly(
            "org.junit.platform:junit-platform-launcher:1.14.4"
    )
}

