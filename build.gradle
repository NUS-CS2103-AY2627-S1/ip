plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.0.0'
    id 'checkstyle'
}

repositories {
    mavenCentral()
}

dependencies {
    // JUnit 5 for unit tests
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // JavaFX 17 for the GUI (see se-education.org JavaFX tutorial parts 1-5).
    // Each OS classifier jar holds the same Java classes plus that OS's native
    // libraries, so the fat jar carries natives for Windows, Linux and Apple
    // Silicon. The Intel ':mac' classifier is left out on purpose: its natives
    // share file names with ':mac-aarch64', so only one of the two can live in a
    // single jar (Intel Macs need a JDK that bundles JavaFX, e.g. Azul Zulu FX).
    String javaFxVersion = '17.0.7'
    List<String> javaFxPlatforms = ['win', 'mac-aarch64', 'linux']
    List<String> javaFxModules = ['javafx-base', 'javafx-controls', 'javafx-fxml', 'javafx-graphics']
    javaFxModules.each { module ->
        javaFxPlatforms.each { platform ->
            implementation("org.openjfx:${module}:${javaFxVersion}:${platform}")
        }
    }
}

java {
    // Java 25 matches the course toolchain; the Azul "FX" build of JDK 25 also
    // bundles the JavaFX runtime, which the GUI needs (see AGENTS.md).
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // The GUI is the default entry point; the text CLI still runs via hu9o.Hu9o.
    mainClass = 'hu9o.gui.Launcher'
}

checkstyle {
    toolVersion = '10.12.5'
    configFile = file("${rootDir}/config/checkstyle/checkstyle.xml")

}

// Builds a single self-contained "fat" JAR at build/libs/hu9o.jar that bundles
// every runtime dependency, so it can be launched with `java -jar` on any
// machine that has a JRE. Shadow reads Main-Class from `application.mainClass`.
shadowJar {
    archiveBaseName = 'hu9o'
    archiveClassifier = ''   // drop the default "-all" suffix
    archiveVersion = ''      // drop the version number from the file name

    // The per-OS JavaFX jars each repeat the same Java classes; without this Shadow
    // writes every copy (about 4x the size). Only file names unique to one OS
    // (the .dll/.so/.dylib natives) are unaffected, so every OS still gets its natives.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

test {
    useJUnitPlatform()

    // Hu9o loads and saves ./data relative to its working directory, so give the tests a
    // fresh empty scratch folder. Otherwise they read whatever tasks and contacts the
    // developer has saved while using the app, and pass or fail depending on that data.
    workingDir = layout.buildDirectory.dir('test-workdir').get().asFile
    doFirst {
        workingDir.deleteDir()
        workingDir.mkdirs()
    }

    // Print each test method to the console as it runs, instead of only
    // writing the HTML report. 'failed' also prints the assertion mismatch.
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

run {
    standardInput = System.in
    enableAssertions = true   // so `./gradlew run` exercises the `assert` statements
}