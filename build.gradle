plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javafxVersion = '17.0.7'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    // Include JavaFX native libraries for every platform supported by the smoke tester.
    // The JavaFX plugin adds the libraries for the current build platform; these extra
    // variants ensure that the shadow JAR also works when copied to another OS.
    ['linux', 'win', 'mac', 'mac-aarch64'].each { platform ->
        runtimeOnly "org.openjfx:javafx-base:${javafxVersion}:${platform}"
        runtimeOnly "org.openjfx:javafx-graphics:${javafxVersion}:${platform}"
        runtimeOnly "org.openjfx:javafx-controls:${javafxVersion}:${platform}"
    }
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

javafx {
    version = '17.0.7'
    modules = ['javafx.controls']
}

application {
    // ShadowJar uses the application plugin's main class when creating the manifest.
    mainClass = 'xue.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    // Produce one executable JAR containing the application and all runtime dependencies.
    archiveFileName = 'duke.jar'
}

run {
    standardInput = System.in
}

tasks.register('runConsole', JavaExec) {
    group = 'application'
    description = 'Runs the original console application.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'xue.Xue'
    standardInput = System.in
}
