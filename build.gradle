/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '14.1.0'
}

jacoco {
    toolVersion = '0.8.14'
}

// Measure non-GUI application code with the ordinary JUnit suite.
tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        html.required = true
        xml.required = true
    }
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude 'cheecken/Main.class', 'cheecken/Launcher.class'
    })
}

dependencies {
    String javaFxVersion = '17.0.7'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    testImplementation libs.org.junit.jupiter.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}

group = 'cheecken'
version = '1.0-SNAPSHOT'
description = 'cheecken'

application {
    mainClass = 'cheecken.Launcher'
}

tasks.named('shadowJar') {
    archiveBaseName = 'cheecken'
    archiveVersion = project.version
    archiveClassifier = 'all'
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

//tasks.withType(Javadoc) {
//    options.encoding = 'UTF-8'
//}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.named('run') {
    standardInput = System.in
}

// Preserve the console interface for debugging and acceptance tests.
tasks.register('runCli', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'cheecken.Cheecken'
    standardInput = System.in
}

// Opt-in because a JavaFX acceptance test needs a graphical desktop.
tasks.register('guiTest', Test) {
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    systemProperty 'cheecken.guiTest', 'true'
    filter {
        includeTestsMatching 'cheecken.MainTest'
    }
}
