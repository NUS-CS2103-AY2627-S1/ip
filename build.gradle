plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

checkstyle {
    // The rules themselves live in config/checkstyle/checkstyle.xml, which is the
    // sample configuration for the SE-EDU coding standard. Only the version of the
    // tool that reads them is pinned here, so a Gradle upgrade cannot quietly
    // change which violations are reported.
    toolVersion = '11.0.0'
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    implementation("org.openjfx:javafx-base:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-base:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-controls:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-fxml:${javaFxVersion}:linux")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:win")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:mac")
    implementation("org.openjfx:javafx-graphics:${javaFxVersion}:linux")

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

javadoc {
    // Turn on every doclint check. A missing @param or a {@link} pointing at
    // nothing is a documentation bug, and the cheapest time to fix one is while
    // the code it describes is still fresh.
    options.addStringOption('Xdoclint:all', '-quiet')
}

application {
    // Launcher, not Main: starting a JavaFX Application subclass directly from a
    // plain classpath makes the runtime complain about missing JavaFX components,
    // so a separate class that is not an Application launches it instead.
    mainClass = 'chione.gui.Launcher'
    // Java runs with assertions off unless asked. -ea turns them on for
    // `gradle run` and for the generated start scripts, so the assert
    // statements in the code actually execute rather than being skipped.
    applicationDefaultJvmArgs = ['-ea']
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'chione.jar'
}

run {
    standardInput = System.in
}

// The text interface is kept alongside the GUI: it is far easier to drive from a
// script, so it stays the quickest way to check the behavior behind the window.
tasks.register('runText', JavaExec) {
    group = 'application'
    description = 'Runs Chione with its text interface, on the console.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'chione.Chione'
    standardInput = System.in
    // Same reason as applicationDefaultJvmArgs above: this task is a separate
    // JavaExec, so it does not inherit the flag from the application block.
    enableAssertions = true
}
