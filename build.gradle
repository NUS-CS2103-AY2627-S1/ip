plugins {
    id 'java'
    id 'checkstyle'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
    maxWarnings = 0
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required = true
        xml.required = true
    }
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    // Bundle JavaFX native libraries for every OS supported by the release JAR.
    ['base', 'controls', 'fxml', 'graphics'].each { module ->
        ['win', 'mac', 'linux'].each { platform ->
            implementation "org.openjfx:javafx-${module}:${javaFxVersion}:${platform}"
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform {
        excludeTags 'gui'
    }

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'zikiai.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'zikiai.jar'
}

run {
    standardInput = System.in
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs the original console interface.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'zikiai.Zikiai'
    standardInput = System.in
}

tasks.register('printCompileClasspath') {
    description = 'Provides dependencies for the isolated console test compiler.'
    doLast {
        println configurations.compileClasspath.asPath
    }
}

tasks.register('guiTest', Test) {
    group = 'verification'
    description = 'Runs JavaFX smoke tests; requires a graphical desktop.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'gui'
    }
    systemProperty 'gui.snapshot', layout.buildDirectory.file('reports/gui/window.png').get().asFile.absolutePath
}
