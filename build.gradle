plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'checkstyle'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

javafx {
    version = '25.0.1'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

// Include each JavaFX platform's native libraries so the submitted fat JAR can
// be launched on Windows, Linux, and macOS, regardless of the build machine.
def javafxPlatforms = [ 'linux', 'mac', 'mac-aarch64', 'win' ]
def javafxModules = [ 'base', 'graphics', 'controls', 'fxml' ]

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'

    javafxPlatforms.each { platform ->
        javafxModules.each { module ->
            runtimeOnly "org.openjfx:javafx-${module}:25.0.1:${platform}"
        }
    }
}

test {
    useJUnitPlatform()
    enableAssertions = true

    // Keep tests that exercise relative-path storage away from the user's real data file.
    File testWorkingDirectory = layout.buildDirectory.dir('test-working-directory').get().asFile
    doFirst {
        testWorkingDirectory.mkdirs()
    }
    workingDir testWorkingDirectory

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'mono.jar'
}

run {
    enableAssertions = true
    standardInput = System.in
}

checkstyle {
    toolVersion = '11.0.0'
}
