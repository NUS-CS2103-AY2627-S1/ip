plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '17.0.7'

    ['win', 'mac', 'linux'].each { platform ->
        implementation "org.openjfx:javafx-base:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-controls:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-fxml:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${platform}"
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    // Existing tests use main methods until the later A-JUnit increment.
    failOnNoDiscoveredTests = false

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'stephen.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'orbit.jar'

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }

    // Preserve service-provider registrations contributed by runtime dependencies.
    mergeServiceFiles()

    // Dependency signatures no longer match after their contents are repackaged.
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}

run {
    standardInput = System.in
}

tasks.register('runHelloWorld', JavaExec) {
    group = 'application'
    description = 'Runs the isolated JavaFX setup verification application.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'stephen.helloworld.HelloWorldLauncher'
}

tasks.register('runCli', JavaExec) {
    group = 'application'
    description = 'Runs the original command-line chatbot.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'stephen.Stephen'
    standardInput = System.in
}
