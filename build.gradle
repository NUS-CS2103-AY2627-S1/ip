plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'com.gradleup.shadow' version '8.3.5'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

version = '0.2.1'

checkstyle {
    toolVersion = '10.2'
    configDirectory = file("$rootDir/config/checkstyle")
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.2'
    modules = ['javafx.controls', 'javafx.fxml']
}

// Explicitly bundle JavaFX natives for every target OS so the fat jar
// runs on Windows, Linux, and macOS (both Intel and Apple Silicon),
// not only the OS the jar was built on.
// Order matters: shadowJar bundles the first classifier's natives when
// filenames collide (mac vs mac-aarch64 both ship same libNAME.dylib
// paths), so put the Apple Silicon classifier first because the course
// smoke test environment uses Mac(ARM).
def javafxTargetPlatforms = ['mac-aarch64', 'win', 'linux', 'mac']
def javafxBundledModules = ['base', 'controls', 'graphics', 'fxml']

dependencies {
    javafxBundledModules.each { mod ->
        javafxTargetPlatforms.each { platform ->
            implementation "org.openjfx:javafx-${mod}:21.0.2:${platform}"
        }
    }
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
    }
}

application {
    mainClass = 'chin.Launcher'
}

run {
    standardInput = System.in
    jvmArgs '-ea'
}

jar {
    archiveBaseName = 'chin'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'chin.Chin'
    }
}

shadowJar {
    archiveBaseName = 'chin'
    archiveClassifier = 'all'
    archiveVersion = ''
    manifest {
        attributes 'Main-Class': 'chin.Launcher'
    }
}

tasks.named('distTar') { dependsOn shadowJar }
tasks.named('distZip') { dependsOn shadowJar }
tasks.named('startScripts') { dependsOn shadowJar }
tasks.named('startShadowScripts') { dependsOn jar }
