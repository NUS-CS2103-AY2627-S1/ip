plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

javafx {
    version = '25.0.1'
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

checkstyle {
    toolVersion = '11.0.0'
}

jacoco {
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    // JavaFX rendering and its launcher are covered by the manual GUI plan.
    classDirectories.setFrom(sourceSets.main.output.asFileTree.matching {
        exclude 'bkxss/BkxssGui*', 'bkxss/Launcher*'
    })
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

configurations {
    javaFxLinuxRuntime
    javaFxMacRuntime
    javaFxWindowsRuntime
}

dependencies {
    String jUnitVersion = '5.14.4'
    String javaFxVersion = '25.0.1'

    ['base', 'graphics', 'controls', 'fxml'].each { module ->
        javaFxLinuxRuntime("org.openjfx:javafx-${module}:${javaFxVersion}:linux") {
            transitive = false
        }
        javaFxMacRuntime("org.openjfx:javafx-${module}:${javaFxVersion}:mac") {
            transitive = false
        }
        javaFxWindowsRuntime("org.openjfx:javafx-${module}:${javaFxVersion}:win") {
            transitive = false
        }
    }

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()
    finalizedBy jacocoTestReport

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'bkxss.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'bkxss.jar'
    configurations = [project.configurations.javaFxLinuxRuntime,
            project.configurations.javaFxMacRuntime,
            project.configurations.javaFxWindowsRuntime]
}

run {
    standardInput = System.in
}
