plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

checkstyle {
    toolVersion = '11.0.0'
    maxWarnings = 0
}

dependencies {
    String javaFxVersion = '17.0.7'
    for (String platform : ['win', 'mac', 'linux']) {
        implementation "org.openjfx:javafx-base:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-controls:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-fxml:${javaFxVersion}:${platform}"
        implementation "org.openjfx:javafx-graphics:${javaFxVersion}:${platform}"
    }

    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

jacoco {
    toolVersion = '0.8.14'
}

// Measure the automatically testable core; visual JavaFX behavior has its own test plan.
jacocoTestReport {
    dependsOn test
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        exclude 'glennon/gui/**'
    })
    reports {
        html.required = true
        xml.required = true
    }
}

application {
    mainClass = 'glennon.gui.Launcher'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'Glennon.jar'

    manifest {
        attributes 'Main-Class': application.mainClass.get()
    }
}

run {
    standardInput = System.in
}

// Keep the original console available for regression testing and terminal use.
tasks.register('runCli', JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'glennon.Glennon'
    standardInput = System.in
}
