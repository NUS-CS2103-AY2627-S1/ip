name: Release JAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check and build distributable JAR
        run: ./gradlew releaseJar

      - name: Verify JAR manifest
        run: >-
          test "$(unzip -p build/libs/dude.jar META-INF/MANIFEST.MF
          | grep -c '^Main-Class: dude.gui.Launcher')" -eq 1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/libs/dude.jar \
          --title "DUDE $GITHUB_REF_NAME" \
          --generate-notes
