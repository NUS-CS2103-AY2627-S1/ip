name: Java CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Grant execute permission for gradlew (*nix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Build and check with Gradle (*nix)
        if: runner.os != 'Windows'
        run: ./gradlew check

      - name: Build and check with Gradle (Windows)
        if: runner.os == 'Windows'
        run: ./gradlew.bat check
