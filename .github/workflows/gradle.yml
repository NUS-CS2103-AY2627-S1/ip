name: Java CI

on: [push, pull_request]

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  build:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-24.04
            macArm64: 'false'
            jar: sage.jar
            macArchitecture: x64
          - platform: windows-2025
            macArm64: 'false'
            jar: sage.jar
            macArchitecture: x64
          - platform: macos-15-intel
            macArm64: 'false'
            jar: sage.jar
            macArchitecture: x64
          - platform: macos-15
            macArm64: 'true'
            jar: sage.jar
            macArchitecture: arm64
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Verify acceptance runner failure handling
        run: python -m unittest discover -s test -p "test_*.py"

      - name: Build, test, and verify coverage
        shell: bash
        run: ./gradlew --no-daemon clean check shadowJar -PmacArm64=${{ matrix.macArm64 }}

      - name: Verify packaged resources and persistence
        run: python scripts/check-release.py --jar build/libs/${{ matrix.jar }} --mac-architecture ${{ matrix.macArchitecture }}

      - name: Run exact CLI acceptance scenarios against the JAR
        run: python .codex/skills/test-ui/scripts/run-ui-tests.py --plan test/ui-test-plan.md --jar build/libs/${{ matrix.jar }}

      - name: Retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ matrix.platform }}
          path: |
            build/reports/tests/test/
            build/reports/jacoco/test/

      - name: Retain verified release JAR
        uses: actions/upload-artifact@v7
        with:
          name: sage-${{ matrix.platform }}
          path: build/libs/${{ matrix.jar }}
          if-no-files-found: error
