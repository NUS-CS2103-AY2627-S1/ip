name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      # The shell is named so that the same command works on Windows, whose
      # default shell does not run the extensionless gradlew script.
      - name: Build and check with Gradle
        shell: bash
        run: ./gradlew check

      # gradlew check only knows about src/test/java. The text UI cases start
      # the whole program and compare entire console sessions, which is what
      # catches a change to Billy's wording or the flow of the conversation.
      # One platform is enough: they test Billy's output, not the machine.
      - name: Run the text UI tests
        if: runner.os == 'Linux'
        run: python3 .claude/skills/test-ui/scripts/run-ui-tests.py
