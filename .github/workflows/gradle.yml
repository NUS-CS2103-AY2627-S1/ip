name: Java CI

on: [push, pull_request]

# The workflow only reads the repository, so the token it is given may only read.
permissions:
  contents: read

defaults:
  run:
    # Windows runners default to PowerShell, which cannot launch the gradlew shell script.
    shell: bash

jobs:
  build:
    strategy:
      # A failure on one operating system should not hide the result on the others.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check
