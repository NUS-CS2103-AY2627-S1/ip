name: Java CI

# Run on every push to the fork and on every pull request, so a broken build
# is reported before it can be merged rather than after.
on: [push, pull_request]

jobs:
  build:
    strategy:
      # Suki is meant to run wherever Java does, and the save-file code touches
      # the filesystem, so it is checked on all three platforms.
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
      # Report every platform's result, rather than cancelling the rest as soon
      # as one fails.
      fail-fast: false
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and run tests
        run: ./gradlew check

      - name: Build the JAR
        run: ./gradlew shadowJar
