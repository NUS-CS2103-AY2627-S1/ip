# Runs the same checks a developer runs locally, on every push and pull
# request, so a broken build is caught before it reaches master.
name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Zulu is the distribution the course specifies; the build targets
      # Java 25, so anything lower fails at compile time.
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      # `check` alone covers tests and Checkstyle. javadoc and shadowJar are
      # added because a dangling {@link} or a jar that fails to assemble are
      # also things nobody wants to discover after merging.
      - name: Build and check with Gradle
        run: ./gradlew check javadoc shadowJar
