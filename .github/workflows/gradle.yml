name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      # Caches Gradle's dependency store between runs, so a fetch that has
      # succeeded once is served from cache thereafter and a blip on the Gradle
      # Plugin Portal or Maven Central does not fail the build.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and check with Gradle
        run: ./gradlew check

