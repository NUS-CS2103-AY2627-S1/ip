name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check portable code with Gradle
        run: ./gradlew check javadoc shadowJar jacocoTestReport

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.platform }}
          path: |
            build/reports/tests
            build/reports/jacoco
            build/reports/checkstyle

  gui-test:
    runs-on: ubuntu-latest

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Run JavaFX tests with a virtual display
        run: xvfb-run --auto-servernum ./gradlew guiTest

      - name: Upload GUI test reports and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-reports
          path: |
            build/reports/tests/guiTest
            build/reports/gui
