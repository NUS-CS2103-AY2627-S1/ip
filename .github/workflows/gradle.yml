name: Java CI

on: [ push, pull_request ]

jobs:
  build:
    strategy:
      matrix:
        platform: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check

      - name: Build JAR
        run: ./gradlew shadowJar

      - name: Smoke test JAR
        shell: bash
        run: |
          printf 'bye\n' | java -cp build/libs/chattingheads.jar chattingheads.ChattingHeads

      - name: Smoke test GUI on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a java -jar build/libs/chattingheads.jar &
          PID=$!

          sleep 5

          if ! kill -0 "$PID" 2>/dev/null; then
            wait "$PID"
            exit 1
          fi

          kill "$PID"
          wait "$PID" || true
