name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check

      - name: Smoke-test fat JAR
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y xvfb libgtk-3-0 libxtst6 libxi6
            export DISPLAY=:99
            Xvfb :99 -screen 0 1024x768x24 &
            sleep 1
          fi
          java -Dprism.order=sw -jar build/libs/sal.jar > smoke-out.txt 2> smoke-err.txt &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "sal.jar still running after 15s on ${{ runner.os }} (JavaFX started)"
            kill "$PID" || true
            wait "$PID" 2>/dev/null || true
          else
            status=0
            wait "$PID" || status=$?
            echo "sal.jar exited early with status ${status} on ${{ runner.os }}"
            echo "----- stdout -----"
            cat smoke-out.txt || true
            echo "----- stderr -----"
            cat smoke-err.txt || true
            exit 1
          fi

