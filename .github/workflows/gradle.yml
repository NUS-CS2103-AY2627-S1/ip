name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew build

      - name: Smoke-test packaged JAR in an empty folder
        shell: bash
        run: |
          mkdir -p build/smoke
          cp build/libs/Toot.jar build/smoke/Toot.jar
          cd build/smoke
          printf 'todo cross-platform test\nlist\nbye\n' | java -cp Toot.jar toot.Toot > output.txt
          grep -F '1.[T][ ] cross-platform test' output.txt
          test -f data/toot.txt
