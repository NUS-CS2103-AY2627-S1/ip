name: Java CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx
          cache: gradle

      - name: Build and run checks
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ./gradlew check javadoc shadowJar
          elif [ "$RUNNER_OS" = "Windows" ]; then
            ./gradlew.bat check javadoc
          else
            ./gradlew check javadoc
          fi
