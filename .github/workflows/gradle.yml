# Adapted from https://github.com/se-edu/duke/blob/full-template/.github/workflows/gradle.yml
name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    name: Build and check (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25 with JavaFX
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a ./gradlew --no-daemon check shadowJar
          else
            ./gradlew --no-daemon check shadowJar
          fi

      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.platform }}
          path: build/reports/
