name: Java CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Check and build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Match the x86-64 native JavaFX libraries bundled by this project.
        os: [ubuntu-24.04, windows-2025, macos-15-intel]

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          architecture: x64
          cache: gradle
          cache-dependency-path: |
            build.gradle
            gradle/wrapper/gradle-wrapper.properties

      - name: Run JUnit and Checkstyle and build the fat JAR
        shell: bash
        run: ./gradlew check shadowJar --console=plain --no-daemon

      - name: Run isolated console regression tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.codex/skills/test-ui/scripts/run_ui_tests.ps1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/
            build/test-results/
          if-no-files-found: warn
          retention-days: 7
