name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25.0.3
          java-package: jdk
      - name: Build and check with Gradle
        run: ./gradlew clean check shadowJar
      - name: Upload executable JAR
        if: matrix.platform == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: gary-jar
          path: build/libs/gary.jar
          if-no-files-found: error

  release-smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25.0.3
          java-package: jdk
      - uses: actions/download-artifact@v8
        with:
          name: gary-jar
          path: release
      - name: Test the same release JAR on Java 25.0.3
        run: python test/run_jar_smoke.py release/gary.jar
