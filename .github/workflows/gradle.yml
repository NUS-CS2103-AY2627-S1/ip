name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up plain JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk

      - name: Build and check with Gradle on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum ./gradlew check

      - name: Build and check with Gradle
        if: runner.os != 'Linux'
        run: ./gradlew check

      # Build once on Windows, then give the identical JAR to every smoke-test job.
      - name: Package release and smoke-test agent
        if: runner.os == 'Windows'
        run: ./gradlew shadowJar smokeAgentJar

      - name: Upload packaged application
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: anders-release
          path: build/libs/anders.jar
          if-no-files-found: error

      - name: Upload smoke-test agent
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: anders-smoke-agent
          path: build/libs/anders-smoke-agent.jar
          if-no-files-found: error

  jar-smoke:
    needs: build
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Set up plain JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Download the release JAR
        uses: actions/download-artifact@v8
        with:
          name: anders-release
          path: build/libs

      - name: Download the external test agent
        uses: actions/download-artifact@v8
        with:
          name: anders-smoke-agent
          path: build/libs

      - name: Smoke-test packaged GUI on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum python test/run_jar_smoke.py

      - name: Smoke-test packaged GUI
        if: runner.os != 'Linux'
        run: python test/run_jar_smoke.py

      - name: Upload smoke-test session records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jar-smoke-${{ matrix.platform }}
          path: build/reports/jar-smoke
          if-no-files-found: warn
