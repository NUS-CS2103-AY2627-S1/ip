# Continuous Integration (CI) workflow for GitHub Actions.
# Builds the project and runs all checks (JUnit tests and Checkstyle)
# on every push and pull request, on all three major operating systems.
# Adapted from https://github.com/se-edu/addressbook-level3/blob/master/.github/workflows/gradle.yml
name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      # Guards against a tampered gradle-wrapper.jar being committed to the repo.
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      # The project targets Java 25; the jdk+fx package bundles JavaFX.
      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      # 'check' runs the JUnit tests and Checkstyle; any failure fails the build.
      - name: Build and check with Gradle
        run: ./gradlew check
