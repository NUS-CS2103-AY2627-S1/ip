# Runs the project's checks on every push and every pull request, on all three
# operating systems, so a change that works on one computer but breaks the
# build elsewhere is caught before it reaches master.
#
# Based on the SE-EDU Duke template's workflow, with one step added: the
# text-based UI tests, which start the shipped jar and type commands at it.
# `gradle check` covers Checkstyle and the JUnit tests but never runs the jar.
name: Java CI

on: [push, pull_request]

jobs:
  build:
    strategy:
      # Let the other two platforms finish when one fails, so a failure can be
      # seen to be specific to one operating system or common to all of them.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          java-package: jdk+fx

      - name: Build and check with Gradle
        run: ./gradlew check

      - name: Set up Python for the text-based UI tests
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Run the text-based UI tests
        run: python .claude/skills/test-ui/scripts/run-ui-tests.py
