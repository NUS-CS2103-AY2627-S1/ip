name: Java CI

# Runs on every push and on every pull request, so a branch is checked both
# while it is being worked on and again as it is proposed for merging.
on: [push, pull_request]

jobs:
  build:
    strategy:
      # One platform failing should not hide the result on the others, which is
      # the whole point of checking three of them.
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Set up repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Cache Gradle files
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      # bash on every platform, so the one ./gradlew line works on Windows too
      # rather than needing a separate gradlew.bat step.
      - name: Build and run checks
        shell: bash
        run: ./gradlew check

      # The scripted console tests are the other half of this project's testing,
      # and are run only on Linux: they are platform independent, so running
      # them three times would cost minutes to learn nothing new.
      - name: Run the scripted UI tests
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: python3 .codex/skills/test-ui/scripts/run_ui_tests.py --project-root . --plan test/ui-test-plan.md

      - name: Build the distributable JAR
        shell: bash
        run: ./gradlew shadowJar
