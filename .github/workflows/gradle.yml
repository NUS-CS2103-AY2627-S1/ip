name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and quality checks
        run: ./gradlew clean check jar portableZip javadoc

      - name: Upload the cross-platform release JAR
        uses: actions/upload-artifact@v4
        with:
          name: Wangsa-release
          path: |
            build/libs/Wangsa.jar
            build/distributions/Wangsa.zip

  verify-release:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      - name: Check platform-dependent behavior
        if: runner.os != 'Linux'
        shell: bash
        run: ./gradlew check

      - uses: actions/download-artifact@v4
        with:
          name: Wangsa-release
          path: release

      - name: Test the shared JAR on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/release_smoke.py release/libs/Wangsa.jar release/distributions/Wangsa.zip

      - name: Test the shared JAR on Windows and macOS
        if: runner.os != 'Linux'
        run: python tests/release_smoke.py release/libs/Wangsa.jar release/distributions/Wangsa.zip
