name: Build JAR for marquee-core
on:
  push:
    tags:
      - "core-v*"
      - "!core-v*-SNAPSHOT"
permissions:
  contents: write
jobs:
  build-core-jar:
    name: Build JAR for marquee-core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew :marquee-core:jar
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: marquee-core/build/libs/*
          draft: true
