name: CI

on:
  push:
    branches:
      - master
      - branch-*
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests and checks
        run: ./gradlew test checkstyleMain checkstyleTest shadowJar --no-daemon
