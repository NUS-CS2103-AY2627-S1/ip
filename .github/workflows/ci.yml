name: Java CI

on: [push, pull_request]

# The workflow only needs permission to read the repository contents.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    strategy:
      matrix:
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          java-package: jdk+fx
          cache: gradle

      - name: Run tests, Checkstyle, and build JAR
        run: ./gradlew clean check shadowJar
