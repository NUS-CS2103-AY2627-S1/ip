name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install JavaFX test display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0

      - name: Build and test
        run: xvfb-run -a ./gradlew clean check
