name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Run tests and build the executable JAR on Windows
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon check shadowJar
      - name: Run tests and build the executable JAR on Linux
        if: runner.os == 'Linux'
        run: ./gradlew --no-daemon check shadowJar
