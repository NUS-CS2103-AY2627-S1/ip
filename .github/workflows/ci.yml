name: Java CI

# 1. This tells GitHub WHEN to run the tests
on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    # 2. This is the operating system GitHub will use to run your code
    runs-on: ubuntu-latest

    # 3. These are the sequential steps GitHub will take
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build and Test
        # If you are using Gradle, it will run your tests here
        run: ./gradlew check