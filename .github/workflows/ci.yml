name: Java CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-latest
            gradle: ./gradlew
          - name: macOS
            os: macos-latest
            gradle: ./gradlew
          - name: Windows
            os: windows-latest
            gradle: .\gradlew.bat

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run tests and style checks
        run: ${{ matrix.gradle }} check --no-daemon --stacktrace
