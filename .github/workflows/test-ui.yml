name: Test UI Plan and Run

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test-ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Run check-plan-and-run
        shell: pwsh
        run: |
          Write-Host "Invoking plan check and test runner"
          pwsh -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .copilot\skills\test-ui\scripts\check-plan-and-run.ps1 test\ui-test-plan.md
