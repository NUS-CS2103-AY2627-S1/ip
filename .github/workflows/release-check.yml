name: Release checks

on:
  push:
    branches: [master, codex/final-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and check using Java 25
        run: |
          java -version
          ./gradlew --no-daemon clean check shadowJar
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: |
            build/libs/arin-all.jar
            build/classes/java/test/arin/GuiSmokeLauncher*.class
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: candidate
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0
      - name: Smoke-test the same bundled JAR in an empty folder
        shell: bash
        run: |
          java -version
          candidate_root="$PWD/candidate"
          smoke_dir="$(mktemp -d)"
          cp "$candidate_root/libs/arin-all.jar" "$smoke_dir/arin-all.jar"
          cd "$smoke_dir"
          if [ "$RUNNER_OS" = Windows ]; then
            candidate_root="$(cygpath -m "$candidate_root")"
            class_path="arin-all.jar;$candidate_root/classes/java/test"
          else
            class_path="arin-all.jar:$candidate_root/classes/java/test"
          fi
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a java -ea --enable-native-access=ALL-UNNAMED -cp "$class_path" arin.GuiSmokeLauncher
          else
            java -ea --enable-native-access=ALL-UNNAMED -cp "$class_path" arin.GuiSmokeLauncher
          fi
